plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'practice'
version = '0.0.1-SNAPSHOT'
description = 'User 엔티티 연습용 - DateManagerBackend와 완전히 별개 프로젝트'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // User 엔티티(@Entity, @Id, @Column 등)를 쓰기 위해 필요한 최소 의존성
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // BCryptPasswordEncoder를 쓰기 위한 의존성 (전체 spring-security 대신 암호화 부분만)
    implementation 'org.springframework.security:spring-security-crypto'
    // @RestController, ResponseEntity 등 Controller에 필요한 의존성
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    // 실제 DB 없이 메모리에서 바로 도는 H2 DB - 앱 끄면 데이터 사라짐, 연습용으로 딱 좋음
    // (H2 콘솔 서블릿을 코드에서 직접 참조해야 해서 runtimeOnly가 아니라 implementation으로 씀)
    implementation 'com.h2database:h2'
}
