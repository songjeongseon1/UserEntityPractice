spring:
  datasource:
    url: jdbc:h2:mem:practicedb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update   # User 엔티티 보고 테이블을 자동으로 만들어줌 (연습용이라 이렇게 씀, 실서비스에선 안 씀)
    show-sql: true        # 실행되는 SQL을 콘솔에 그대로 보여줌 - 뭘 하는지 눈으로 확인 가능
  # H2 콘솔은 Spring Boot 4.1부터 이 설정(spring.h2.console.*)으로 자동 등록이 안 돼서
  # config/SecurityConfig.java에서 서블릿을 직접 등록하는 방식으로 대신 처리함.

server:
  port: 8080
